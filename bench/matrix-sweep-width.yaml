# Sensitivity sweep 5 (arena spec §C.2, PREREG §5): width. The total number of agents of every run
# is 4, 8, 12, 24 or 48 (bench/scaling.py: tree_for), the same for the swarm and the supervisors.
# T2 at C3, 3 seeds, $0, sim clock. 3 x 2 x 3 x 5 = 90 runs. T2 has 6 sessions, so agents beyond
# 12 have little to do; the sweep shows what a wider tree changes for the blast radius.
#   uv run fractalswarm bench bench/matrix-sweep-width.yaml --fake
name: sweep-agents
workflows: [swarm, durable-max, durable]
tasks: [t2_conference]
profiles: [C0, C3]
seeds: [1, 2, 3]
agents: [4, 8, 12, 24, 48]
contributor: false
out_dir: results/sweeps/agents
chart_task: t2_conference
notes: >
  A workload condition, not a rival assumption: it scopes a claim and decides no outcome.
