# 3 workflows x 2 profiles x 4 seeds = 24 runs.
#   uv run fractalswarm bench bench/matrix-per-process-rivals.yaml --fake
name: per-process-rivals
workflows: [durable-max, durable, central]
tasks: [t2_conference]
profiles: [C0, K-o0]
seeds: [1, 2, 3, 4]
contributor: false
