# Sensitivity sweep 3 (arena spec §C.2, PREREG §5): the "fast external restart" case. A process
# manager can see a crash at once, while heartbeats cannot: the supervisors are back after 0.5 or
# 1 s while the swarm keeps its 5 s heartbeat detection. T2 at C3, 3 seeds, $0, sim clock.
# 3 x 2 x 3 x 2 = 36 runs.
#   uv run fractalswarm bench bench/matrix-sweep-fast-restart.yaml --fake
name: sweep-rival-recovery-ms
workflows: [swarm, durable-max, durable]
tasks: [t2_conference]
profiles: [C0, C3]
seeds: [1, 2, 3]
knobs:
  - {rival_recovery_ms: 500}
  - {rival_recovery_ms: 1000}
contributor: false
out_dir: results/sweeps/rival_recovery_ms
chart_task: t2_conference
notes: >
  Asymmetric detection, in the rival's favour. The swarm's rows are the same at both settings.
