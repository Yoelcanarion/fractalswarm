# Replays every run the repository ships, on a machine that is not ours. No key, no model, $0.
name: Replay

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Replay the recorded runs and compare the hashes
        run: |
          for run in demo/*/; do
            echo "== $run"
            uv run fractalswarm replay "$run" --verify | tee /tmp/replay.txt
            grep -q '^MATCH' /tmp/replay.txt
          done
      - name: Recompute every heir of the final run from its log
        run: uv run fractalswarm takeover demo/final
