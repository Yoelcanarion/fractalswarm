[project]
name = "fractalswarm"
version = "0.1.0"
description = "A multi-agent LLM runtime whose orchestrators form a fractal tree: kill half of them mid-run and it still finishes, and every run replays bit-for-bit from a hash-verified log."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yoelcanarion" }]
requires-python = "==3.12.*"
dependencies = [
    "httpx>=0.28.1",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.18",
    "matplotlib>=3.10",
    "openai>=3.40.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "starlette>=1.10.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
fractalswarm = "fractalswarm.cli:app"

[project.optional-dependencies]
# llamafirewall 1.0.3 imports huggingface_hub.HfFolder, which huggingface-hub 1.0 removed,
# and transformers 5 needs huggingface-hub >= 1.31. See docs/api-notes.md.
safety = [
    "huggingface-hub>=0.30.2,<1",
    "llamafirewall>=1.0.3",
    "transformers>=4.51.3,<5",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "promptguard: needs the safety extra and the PromptGuard 2 model; skips when unavailable",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]
