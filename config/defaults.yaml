# Runtime defaults. Durations are seconds of virtual time unless the key ends in _wall_s.

budget:
  project_cap_usd: 150          # FRACTALSWARM_PROJECT_CAP_USD overrides it
  run_cap_usd: 2.0              # used when the TaskSpec sets no budget
  # Share of the run budget spent at which the model ladder steps down (spec §7.4).
  ladder:
    L1: 0.80                    # also stops speculative execution and scales down
    L2: 0.90                    # only the critical path continues
    stop: 0.95                  # partial result plus a resumable checkpoint

scaling:
  mode: exact
  exact:
    fanout: [3, 2]              # root -> 3 tracks -> 6 sessions
    agents_per_leaf: 2
  autoscale:
    max_orchestrators_per_group: 6
    max_agents_per_orchestrator: 4
    max_depth: 2

contracts:
  max_steps: 8

# Failure detection (spec §5.2). Dead after 5 s is also the restart delay of every
# baseline's best-case supervisor (spec §15.2).
membership:
  heartbeat_interval_s: 1
  suspect_after_missed: 3
  dead_after_missed: 5

# Economy (spec §7.2). ``mode: proportional`` runs no epochs; ``auction`` runs the epoch
# auction. An epoch closes on whichever comes first. The estimates price work that is not
# planned yet, and size the bids of RPM and TPM slices (one agent's worth each).
market:
  mode: proportional
  epoch_interval_s: 15
  epoch_max_completions: 10
  floor_usd: 0.08               # a squad may always commit this much: two worst-case calls
  plan_usd: 0.01                # one planning call
  contract_usd: 0.03            # a typical contract, all in; a smaller declared budget wins
  contracts_per_leaf: 3         # contracts a leaf goal is expected to plan
  rpm_per_agent: 30
  tpm_per_agent: 120000

# Circuit breakers (spec §8).
breakers:
  model_endpoint:
    open_after_failures: 5
    failure_window_s: 30
    open_if_retry_after_above_s: 20
    open_base_s: 10             # open for 10 s * 2^k, never less than Retry-After
    open_max_s: 120
    half_open_probes: 1
  channel:                      # per orchestrator pair
    max_msgs: 20
    max_bytes: 65536
    window_s: 10
    pingpong_alternations: 6    # on one correlation id with no new fact
    open_critical_max_per_s: 1  # while open, only the critical lane passes
    half_open_after_s: 15
  topic_storm:
    max_msgs: 50
    window_s: 10
    half_open_after_s: 15
  global_spend:
    max_burn_share_per_min: 0.20  # of the remaining budget
    pause_s: 30

# Client retries on 429, 500 and 503: exponential backoff with jitter, honoring
# Retry-After (spec §8, docs/api-notes.md).
retries:
  base_delay_wall_s: 0.5
  max_attempts: 5
