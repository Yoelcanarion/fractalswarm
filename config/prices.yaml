# Meta Model API prices in USD per 1M tokens (spec §7.1).
# Checked against https://dev.meta.ai/docs/pricing-rate-limits on 2026-10-27: no differences.
# The live spike (scripts/spike_api.py) re-checks the usage fields a real call reports.
#
# Billing rules from the docs (details in docs/api-notes.md):
# - cached_tokens are a subset of the input tokens and bill at cached_input instead of input;
# - reasoning tokens are a subset of the output tokens and bill at the output rate;
# - Meta's injected steering context is not billed and is not counted in usage.
checked_against_docs: 2026-10-27
unit_tokens: 1000000

models:
  muse-wonder-1.0:
    input: 4.00
    cached_input: 0.20
    output: 20.00
  muse-spark-1.3:
    input: 1.25
    cached_input: 0.15
    output: 4.25
  # Prompts and completions may be used to train Meta models. There is no Contributor
  # variant of muse-wonder-1.0 on pay-as-you-go.
  muse-spark-1.3-contributor:
    input: 0.10
    cached_input: 0.002
    output: 0.20

tools:
  # Charged on top of the tokens. Responses API only (not Chat Completions).
  web_search:
    usd_per_1k_queries: 2.50

# Per team and per model; every key of the team shares them.
rate_limits:
  muse-wonder-1.0: {rpm: 3000, tpm: 4000000}
  muse-spark-1.3: {rpm: 3000, tpm: 4000000}
  muse-spark-1.3-contributor: {rpm: 150, tpm: 3000000}
